name: Perimeter VRM (formerly ProcessBolt)
description: >-
  Perimeter (formerly ProcessBolt) is a vendor risk management (VRM) platform
  built for regulated industries. It covers the full third-party risk lifecycle
  through six modules — Monitor (continuous vendor surveillance and alerts),
  Assess (automated risk assessments with a drag-and-drop template builder),
  Extract (AI-powered document intelligence), Verify (attack-surface
  validation), Share (a document management and collaboration hub), and Respond
  (RFP and assessment response automation). The product centralizes vendor
  information, scores and reports vendor risk, and supports no-code integration
  and API-based / CSV vendor imports across US, EU, and Australia data regions.
  ProcessBolt rebranded to Perimeter and now serves the platform from
  perimeter.net; processbolt.com redirects there. No public developer portal,
  OpenAPI, or SDKs are published — the platform's integration APIs are exposed
  to customers rather than through an open developer surface.
